    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background-color: #00000000;
            background-image: url('https://i.postimg.cc/DyC944zj/IMG-0144.jpg');
            background-size: cover;
            background-position: center;
            color: #fff;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow-x: hidden;
            position: relative;
            padding: 20px;
        }
        
                /* ====== MENU STYLES - SỬA LẠI ====== */
        .menu-button {
            position: fixed;
            top: 25px;
            left: 25px;
            background: linear-gradient(135deg, rgba(0, 0, 0, 0.7), rgba(20, 20, 20, 0.5));
            border: 2px solid rgb(67, 236, 51);
            color: rgb(250, 223, 69);
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.8rem;
            cursor: pointer;
            z-index: 100;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.5), 0 0 15px rgba(67, 236, 51, 0.5);
            overflow: hidden;
            backdrop-filter: blur(5px);
        }
        
        .menu-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, rgba(67, 236, 51, 0.3), transparent 70%);
            opacity: 0;
            transition: opacity 0.3s;
        }
        
        .menu-button:hover {
            background: linear-gradient(135deg, rgb(67, 236, 51), rgb(53, 190, 41));
            color: #000;
            transform: scale(1.15) rotate(90deg);
            box-shadow: 0 8px 25px rgba(67, 236, 51, 0.6), 0 0 30px rgba(67, 236, 51, 0.5);
        }
        
        .menu-button:hover::before {
            opacity: 1;
        }
        
        .menu-button.active {
            transform: rotate(90deg);
            background: linear-gradient(135deg, rgb(67, 236, 51), rgb(53, 190, 41));
            color: #000;
            box-shadow: 0 8px 25px rgba(67, 236, 51, 0.6), 0 0 30px rgba(67, 236, 51, 0.5);
        }
        
        /* Menu dropdown */
        .menu-dropdown {
            position: fixed;
            top: 100px;
            left: 25px;
            background: rgba(10, 10, 10, 0.856);
            border: 2px solid rgb(241, 127, 252);
            border-radius: 15px;
            width: 260px;
            padding: 20px;
            z-index: 99;
            display: none;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8), 0 0 20px rgba(241, 127, 252, 0.4);
            backdrop-filter: blur(10px);
            overflow: hidden;
        }
        
        .menu-dropdown::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(45deg, rgb(67, 236, 51), rgb(241, 127, 252), rgb(67, 236, 51));
            border-radius: 17px;
            z-index: -1;
            opacity: 0.4;
            filter: blur(2px);
        }
        
        .menu-dropdown.active {
            display: block;
            animation: slideIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        
        @keyframes slideIn {
            from { 
                opacity: 0; 
                transform: translateY(-20px) scale(0.95); 
            }
            to { 
                opacity: 1; 
                transform: translateY(0) scale(1); 
            }
        }
        
        /* Menu header */
        .menu-header {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(241, 127, 252, 0.4);
        }
        
        .menu-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgb(241, 127, 252);
            margin-right: 15px;
            box-shadow: 0 0 10px rgba(241, 127, 252, 0.5);
        }
        
        .menu-user-info h3 {
            color: rgb(250, 223, 69);
            font-size: 1.2rem;
            margin-bottom: 5px;
            text-shadow: 0 0 5px rgba(250, 223, 69, 0.5);
        }
        
        .menu-user-info p {
            color: #aaa;
            font-size: 0.9rem;
        }
        
        /* Menu items */
        .menu-items {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        .menu-item {
            display: flex;
            align-items: center;
            color: #fff;
            text-decoration: none;
            padding: 14px 18px;
            border-radius: 10px;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            background: rgba(30, 30, 30, 0.7);
            position: relative;
            overflow: hidden;
            border-left: 4px solid transparent;
            backdrop-filter: blur(5px);
        }
        
        .menu-item::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(241, 127, 252, 0.2), transparent);
            transition: left 0.5s;
        }
        
        .menu-item:hover {
            background: rgba(241, 127, 252, 0.15);
            transform: translateX(10px);
            border-left: 4px solid rgb(241, 127, 252);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.4);
        }
        
        .menu-item:hover::before {
            left: 100%;
        }
        
        .menu-item:hover .menu-icon {
            transform: scale(1.2);
            color: rgb(241, 127, 252);
        }
        
        .menu-item:hover .menu-text {
            color: rgb(241, 127, 252);
        }
        
        .menu-item:hover .menu-badge {
            background-color: rgb(241, 127, 252);
            color: #000;
        }
        
        .menu-icon {
            margin-right: 15px;
            font-size: 1.3rem;
            width: 24px;
            text-align: center;
            transition: all 0.3s;
            color: rgb(250, 223, 69);
        }
        
        .menu-text {
            flex: 1;
            font-weight: 500;
            transition: color 0.3s;
        }
        
        .menu-badge {
            background-color: rgba(241, 127, 252, 0.2);
            color: rgb(241, 127, 252);
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: bold;
            transition: all 0.3s;
        }
        
        .menu-divider {
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(241, 127, 252, 0.4), transparent);
            margin: 15px 0;
        }
        
        /* Menu footer */
        .menu-footer {
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid rgba(241, 127, 252, 0.3);
            text-align: center;
        }
        
        .menu-footer-text {
            color: rgba(250, 223, 69, 0.7);
            font-size: 0.85rem;
            text-shadow: 0 0 5px rgba(250, 223, 69, 0.3);
        }
        /* ====== PHẦN CÒN LẠI CỦA CSS ====== */
        /* Hiệu ứng hạt xanh lá bay lên */
        #particles-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }
        
        .particle {
            position: absolute;
            width: 8px;
            height: 8px;
            background-color: rgba(69, 241, 227, 0.705);
            border-radius: 50%;
            bottom: -10px;
            opacity: 0.2;
            animation: floatUp linear infinite;
            box-shadow: 0 0 10px #0f0, 0 0 20px #0f0;
        }
        
        @keyframes floatUp {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 0.8;
            }
            100% {
                transform: translateY(-100vh) rotate(360deg);
                opacity: 0;
            }
        }
        
        /* Nội dung chính */
        .main-content {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            z-index: 10;
            position: relative;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        
        .header {
            margin-bottom: 40px;
        }
        
        .title {
            font-size: 2.8rem;
            margin-bottom: 10px;
            color: #fff;
            text-shadow: 0 0 15px rgba(0, 255, 0, 0.7);
        }
        
        .subtitle {
            font-size: 1.2rem;
            color: #aaa;
            margin-bottom: 30px;
        }
        
        /* Avatar container */
        .avatar-container {
            margin-bottom: 35px;
            position: relative;
        }
        
        .avatar {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #0f0;
            box-shadow: 0 0 25px rgba(0, 255, 0, 0.6);
            animation: pulse 3s infinite;
            transition: all 0.3s ease;
        }
        
        .avatar:hover {
            transform: scale(1.05);
            box-shadow: 0 0 35px rgba(0, 255, 0, 0.9);
        }
        
        @keyframes pulse {
            0% { box-shadow: 0 0 25px rgba(0, 255, 0, 0.6); }
            50% { box-shadow: 0 0 35px rgba(0, 255, 0, 0.9); }
            100% { box-shadow: 0 0 25px rgba(0, 255, 0, 0.6); }
        }
        
        .username {
            font-size: 1.8rem;
            color: #0f0;
            margin-bottom: 40px;
            font-weight: bold;
        }
        
        /* Container cho nút ở giữa - HÀNG DỌC */
        .button-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
            margin: 30px 0;
            gap: 20px;
        }
        
        /* Nút chung */
        .action-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background-color: #00000060;
            color: #0f0;
            border: 3px solid #0f0;
            padding: 18px 40px;
            border-radius: 50px;
            font-size: 1.5rem;
            font-weight: bold;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.3);
            position: relative;
            overflow: hidden;
            z-index: 2;
            width: 250px;
            max-width: 90%;
        }
        
        /* Nút Website với màu sắc đặc biệt */
        .website-button {
            background-color: rgba(0, 0, 0, 0);
            border: 3px solid #7138bb; /* Màu tím đặc trưng của website */
            color: #7138bb;
            box-shadow: 0 0 15px rgba(113, 56, 187, 0.3);
        }
        
        .website-button:hover {
            background-color: #7138bb;
            color: #000;
        }
        
        .website-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            border-radius: 50px;
            box-shadow: 0 0 30px 10px rgba(113, 56, 187, 0.4);
            opacity: 0;
            transition: opacity 0.3s;
            z-index: -1;
        }
        
        .website-button:hover::before {
            opacity: 1;
        }
        
        /* Nút TikTok */
        .tiktok-button {
            background-color: rgba(0, 0, 0, 0);
            border: 3px solid #0a0;
            color: #0a0;
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.2);
        }
        
        .tiktok-button:hover {
            background-color: #0a0;
            color: #000;
        }
        
        .tiktok-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            border-radius: 50px;
            box-shadow: 0 0 30px 10px rgba(0, 255, 0, 0.4);
            opacity: 0;
            transition: opacity 0.3s;
            z-index: -1;
        }
        
        .tiktok-button:hover::before {
            opacity: 1;
        }
        
        /* Biểu tượng trong nút */
        .action-button i {
            margin-right: 12px;
            font-size: 1.5rem;
            transition: transform 0.3s;
        }
        
        /* Biểu tượng đặc biệt cho website */
        .website-button i {
            color: #7138bb;
        }
        
        .tiktok-button i {
            color: #0a0;
        }
        
        .action-button:hover i {
            transform: scale(1.2);
        }
        
        .action-button:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0, 255, 0, 0.5);
        }
        
        .action-button:active {
            transform: translateY(-2px);
        }
        
        /* Social links */
        .social-links {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
        }
        
        .social-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background-color: rgba(0, 0, 0, 0);
            border: 2px solid #0f0;
            color: #0f0;
            font-size: 1.5rem;
            text-decoration: none;
            transition: all 0.3s ease;
        }
        
        .social-icon:hover {
            background-color: #0f0;
            color: #000;
            transform: translateY(-5px);
        }
        
        /* Chỉ dẫn */
        .instruction {
            margin-top: 30px;
            color: #aaa;
            font-size: 1rem;
            text-align: center;
            max-width: 500px;
            line-height: 1.6;
        }
        
        /* Hiệu ứng khi di chuột vào nút */
        .click-effect {
            position: absolute;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background-color: rgba(0, 255, 0, 0.6);
            pointer-events: none;
            transform: translate(-50%, -50%);
            animation: ripple 0.6s linear;
            z-index: 1;
        }
        
        @keyframes ripple {
            0% {
                width: 0;
                height: 0;
                opacity: 0.8;
            }
            100% {
                width: 200px;
                height: 200px;
                opacity: 0;
            }
        }
        
        /* Footer */
        .footer {
            margin-top: 40px;
            color: #666;
            font-size: 0.9rem;
            text-align: center;
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            .title {
                font-size: 2.2rem;
            }
            
            .avatar {
                width: 130px;
                height: 130px;
            }
            
            .username {
                font-size: 1.5rem;
            }
            
            .action-button {
                font-size: 1.3rem;
                padding: 15px 30px;
                width: 230px;
            }
            
            .action-button i {
                font-size: 1.3rem;
            }
            
            .menu-dropdown {
                width: 240px;
                left: 20px;
            }
            
            .menu-button {
                width: 55px;
                height: 55px;
                font-size: 1.6rem;
            }
        }
        
        @media (max-width: 480px) {
            .title {
                font-size: 1.8rem;
            }
            
            .avatar {
                width: 110px;
                height: 110px;
            }
            
            .username {
                font-size: 1.2rem;
            }
            
            .action-button {
                font-size: 1.1rem;
                padding: 12px 25px;
                width: 200px;
            }
            
            .action-button i {
                font-size: 1.1rem;
            }
            
            .menu-button {
                width: 50px;
                height: 50px;
                font-size: 1.4rem;
                top: 15px;
                left: 15px;
            }
            
            .menu-dropdown {
                width: 220px;
                left: 15px;
                top: 80px;
            }
            
            .social-links {
                gap: 15px;
            }
            
            .social-icon {
                width: 45px;
                height: 45px;
                font-size: 1.3rem;
            }
            
            .button-container {
                gap: 15px;
            }
        }
    </style>
</head>

    <script>
        // Tạo hiệu ứng hạt xanh lá bay lên
        function createParticles() {
            const container = document.getElementById('particles-container');
            const particleCount = 10;
            
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.classList.add('particle');
                
                // Kích thước ngẫu nhiên
                const size = Math.random() * 6 + 4;
                particle.style.width = `${size}px`;
                particle.style.height = `${size}px`;
                
                // Vị trí ngẫu nhiên
                const left = Math.random() * 100;
                particle.style.left = `${left}vw`;
                
                // Màu sắc ngẫu nhiên (các sắc thái xanh lá)
                const greenShade = Math.floor(Math.random() * 100) + 155;
                particle.style.backgroundColor = `rgb(0, ${greenShade}, 0)`;
                particle.style.boxShadow = `0 0 10px rgb(0, ${greenShade}, 0), 0 0 20px rgb(0, ${greenShade}, 0)`;
                
                // Tốc độ và độ trễ ngẫu nhiên
                const duration = Math.random() * 5 + 5;
                const delay = Math.random() * 5;
                particle.style.animationDuration = `${duration}s`;
                particle.style.animationDelay = `${delay}s`;
                
                container.appendChild(particle);
                
                // Xóa hạt sau khi hoàn thành animation
                setTimeout(() => {
                    particle.remove();
                }, (duration + delay) * 1000);
            }
        }
        
        // Tạo hạt liên tục
        function startParticleEffect() {
            createParticles();
            // Tạo hạt mới mỗi 1 giây
            setInterval(createParticles, 1000);
        }
        
        // Hiệu ứng khi nhấn vào nút Website
        document.getElementById('website-btn').addEventListener('click', function(e) {
            // Tạo hiệu ứng gợn sóng với màu tím
            const x = e.clientX;
            const y = e.clientY;
            
            const effect = document.createElement('div');
            effect.classList.add('click-effect');
            effect.style.background = 'rgba(113, 56, 187, 0.6)'; /* Màu tím */
            effect.style.left = `${x}px`;
            effect.style.top = `${y}px`;
            
            document.body.appendChild(effect);
            
            // Xóa hiệu ứng sau khi animation kết thúc
            setTimeout(() => {
                effect.remove();
            }, 600);
        });
        
        // Hiệu ứng khi nhấn vào nút TikTok
        document.getElementById('tiktok-btn').addEventListener('click', function(e) {
            // Tạo hiệu ứng gợn sóng với màu xanh lá
            const x = e.clientX;
            const y = e.clientY;
            
            const effect = document.createElement('div');
            effect.classList.add('click-effect');
            effect.style.background = 'rgba(0, 255, 0, 0.6)';
            effect.style.left = `${x}px`;
            effect.style.top = `${y}px`;
            
            document.body.appendChild(effect);
            
            // Xóa hiệu ứng sau khi animation kết thúc
            setTimeout(() => {
                effect.remove();
            }, 600);
        });
        
        // Xử lý menu
        const menuBtn = document.getElementById('menu-btn');
        const menuDropdown = document.getElementById('menu-dropdown');
        
        menuBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            menuBtn.classList.toggle('active');
            menuDropdown.classList.toggle('active');
        });
        
        // Đóng menu khi nhấn ra ngoài
        document.addEventListener('click', function(event) {
            const isClickInsideMenu = menuBtn.contains(event.target) || menuDropdown.contains(event.target);
            
            if (!isClickInsideMenu) {
                menuBtn.classList.remove('active');
                menuDropdown.classList.remove('active');
            }
        });
        
        // Thêm hiệu ứng click cho các mục menu
        const menuItems = document.querySelectorAll('.menu-item');
        menuItems.forEach(item => {
            item.addEventListener('click', function(e) {
                // Tạo hiệu ứng gợn sóng
                const rect = this.getBoundingClientRect();
                const x = rect.left + rect.width / 2;
                const y = rect.top + rect.height / 2;
                
                const effect = document.createElement('div');
                effect.classList.add('click-effect');
                effect.style.width = '10px';
                effect.style.height = '10px';
                effect.style.left = `${x}px`;
                effect.style.top = `${y}px`;
                
                document.body.appendChild(effect);
                
                // Xóa hiệu ứng sau khi animation kết thúc
                setTimeout(() => {
                    effect.remove();
                }, 600);
                
                // Đóng menu sau khi click (trừ khi mở tab mới)
                if (this.target !== '_blank') {
                    setTimeout(() => {
                        menuBtn.classList.remove('active');
                        menuDropdown.classList.remove('active');
                    }, 300);
                }
            });
        });
        
        // Thêm hiệu ứng click cho các nút social
        const socialIcons = document.querySelectorAll('.social-icon');
        socialIcons.forEach(icon => {
            icon.addEventListener('click', function(e) {
                // Tạo hiệu ứng gợn sóng
                const rect = this.getBoundingClientRect();
                const x = rect.left + rect.width / 2;
                const y = rect.top + rect.height / 2;
                
                const effect = document.createElement('div');
                effect.classList.add('click-effect');
                effect.style.left = `${x}px`;
                effect.style.top = `${y}px`;
                
                document.body.appendChild(effect);
                
                // Xóa hiệu ứng sau khi animation kết thúc
                setTimeout(() => {
                    effect.remove();
                }, 600);
            });
        });
        
        // Xử lý lỗi ảnh avatar
        const avatarImgs = document.querySelectorAll('img');
        avatarImgs.forEach(img => {
            img.addEventListener('error', function() {
                console.log('Không thể tải ảnh, đang sử dụng ảnh mặc định');
            });
        });
        
        // Bắt đầu hiệu ứng khi trang được tải
        window.onload = startParticleEffect;
    </script>
</body>
</html>
